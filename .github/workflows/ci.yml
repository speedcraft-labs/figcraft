name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
      CRAFT_FONTS_DIR: ${{ github.workspace }}/craft-fonts
      RUST_MIN_STACK: 8388608
      SQLX_OFFLINE: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: speedcraft-labs/craft-fonts
          ref: 882c08a16407e70cf8dc0ba76688e0ed22e6c19e
          path: craft-fonts
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      # The i18n catalog test invokes `cargo metadata --offline`; fetch every locked target
      # dependency first so macOS and Windows entries in Cargo.lock are available too.
      - run: cargo fetch --locked
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev pkg-config libdbus-1-dev libssl-dev libgtk-3-dev libwebkit2gtk-4.1-dev fonts-noto-cjk fonts-unifont
      - name: Repository CI
        run: cargo xtask ci
